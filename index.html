<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Survival Stories | A2 Homework</title><style>

notice{border-left:5px solid #6d9f89;padding:14px 20px;background:#eaf1e9;border-radius:8px;margin:20px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.final{background:#e5efe7;border-radius:20px;padding:25px}.progress{font-size:15px;color:#e1e9e4}.voice{font-size:16px;color:#5b746a} @media(max-width:700px){header{padding:9px 12px}header strong{font-size:15px}button{font-size:14px;padding:10px}.slide{padding:20px;border-radius:15px;min-height:calc(100vh - 125px)}.grid{grid-template-columns:1fr}.hero{height:160px}.story p{font-size:18px}p{font-size:19px}.nav{gap:4px}}@media print{header,.controls{display:none}.slide{display:block!important;box-shadow:none;page-break-after:always;min-height:0}}

const stories=[{"name": "Yossi Ghinsberg", "loc": "Amazon rainforest · 1981", "paras": ["In 1981, 22-year-old Yossi Ghinsberg went into the Amazon rainforest in Bolivia with three other men. They wanted to explore the wilderness. But the journey became a dangerous challenge. One man became ill, and the group decided to separate. Yossi and his friend Kevin built a raft and travelled down a river. Suddenly, they saw a waterfall ahead. They could not stop the raft. Kevin reached the riverbank, but the water carried Yossi away. When Yossi finally climbed out of the river, he was completely alone. He had no map and almost no food. He shouted for help, but nobody answered.", "In 1981, 22-year-old Yossi Ghinsberg went into the Amazon rainforest in Bolivia with three other men. They wanted to explore the wilderness. But the journey became a dangerous challenge. One man became ill, and the group decided to separate. Yossi and his friend Kevin built a raft and travelled down a river.", "Suddenly, they saw a waterfall ahead. They could not stop the raft. Kevin reached the riverbank, but the water carried Yossi away. When Yossi finally climbed out of the river, he was completely alone. He had no map and almost no food. He shouted for help, but nobody answered.", "For the next 20 days, Yossi had to cope with rain, hunger and insects. He built small shelters from branches and leaves. One night, he woke up and saw a jaguar near him. He used a lighter and insect spray to frighten it away. He was terrified, but he had to control his fear. He pushed himself to keep moving, even when he was very weak.", "Kevin had survived too. He reached a town and returned with local people to look for his friend. On the twenty-first day, Yossi heard a boat. He moved towards the river and saw Kevin. His friend had come back! Yossi was finally rescued. He had relied on his mental strength, but he also survived because Kevin did not give up searching."], "qs": ["Why did the group separate?", "What happened to the raft on the river?", "Why was Yossi alone?", "How did he frighten the jaguar away?", "How did Kevin help Yossi survive?"], "answers": ["One of the men became ill, so the group decided to separate.", "The raft came near a waterfall. Kevin reached the riverbank, but the water carried Yossi away.", "He was carried away by the river and lost his friend.", "He used a lighter and insect spray.", "Kevin returned with local people and found Yossi after about 20 days."]}, {"name": "Harrison Okene", "loc": "Nigeria · 2013", "paras": ["On 26 May 2013, Harrison Okene was working as a cook on a boat near the coast of Nigeria. Early in the morning, a huge wave hit the boat. It turned over and began to sink. Harrison tried to escape, but water came in too quickly. Soon, the boat was lying upside down on the sea floor, about 30 metres underwater. Harrison was trapped inside. He found a small room with a pocket of air above the water. He could breathe, but it was completely dark. He was cold, hungry and frightened. He could not swim to the surface. His biggest challenge was to control his fear and stay alive.", "On 26 May 2013, Harrison Okene was working as a cook on a boat near the coast of Nigeria. Early in the morning, a huge wave hit the boat. It turned over and began to sink. Harrison tried to escape, but water came in too quickly. Soon, the boat was lying upside down on the sea floor, about 30 metres underwater.", "Harrison was trapped inside. He found a small room with a pocket of air above the water. He could breathe, but it was completely dark. He was cold, hungry and frightened. He could not swim to the surface. His biggest challenge was to control his fear and stay alive.", "He waited for hours, then for another day. He thought about his family and tried to stay calm. He had to cope with the cold and the terrible silence. He could not rely on his physical strength to escape. He could only wait and hope someone would find him.", "After about 60 hours, rescue divers entered the sunken boat. They were looking for bodies, not survivors. One diver saw a hand in the darkness. Suddenly, the hand moved and touched him! Harrison was alive. The divers gave him breathing equipment and helped him out carefully. He later spent time in a special chamber before returning safely to the surface. Eleven other people on the boat did not survive."], "qs": ["What happened to the boat?", "Why could Harrison breathe underwater?", "Why was it impossible for him to swim to the surface?", "What did the divers expect to find?", "What happened when a diver saw a hand?"], "answers": ["A huge wave hit it. It turned over and sank.", "He found a small room with a pocket of air above the water.", "The boat was about 30 metres underwater and he was trapped inside.", "They expected to find bodies, not survivors.", "The hand moved and touched the diver. The divers realised Harrison was alive."]}, {"name": "Mauro Prosperi", "loc": "Sahara Desert · 1994", "paras": ["In April 1994, Italian runner Mauro Prosperi took part in a long race across the Sahara Desert. He wanted to achieve his goal and finish the race. On the fourth day, a powerful sandstorm began. Sand filled the air, and Mauro could not see the other runners or the signs showing the route. When the storm finally stopped, Mauro looked around. There were no people, no road and no signs — only sand. He was lost in the wilderness with very little water. Later, he saw a helicopter and tried to signal for help with a flare. But the helicopter did not stop. Mauro was still alone.", "In April 1994, Italian runner Mauro Prosperi took part in a long race across the Sahara Desert. He wanted to achieve his goal and finish the race. On the fourth day, a powerful sandstorm began. Sand filled the air, and Mauro could not see the other runners or the signs showing the route.", "When the storm finally stopped, Mauro looked around. There were no people, no road and no signs — only sand. He was lost in the wilderness with very little water. Later, he saw a helicopter and tried to signal for help with a flare. But the helicopter did not stop. Mauro was still alone.", "He found an empty religious building and used it as a shelter. He was exhausted and frightened. He had to cope with heat, thirst and hunger. He drank his own urine and caught bats to survive. After several days, he decided to leave the shelter and continue walking. He had to push himself, although every step was a challenge.", "Eventually, after around nine days lost in the desert, Mauro met people who helped him reach safety in Algeria. He had travelled far away from the race route. His physical strength helped him walk, but his mental strength helped him continue when he almost lost hope. His family had feared he would never come home."], "qs": ["Why did Mauro lose the race route?", "How did he try to contact a helicopter?", "Where did he find shelter?", "What did he do when he left the shelter?", "How did his journey end?"], "answers": ["A sandstorm stopped him from seeing the other runners and the route signs.", "He used a flare to signal for help, but the helicopter did not stop.", "He found an empty religious building.", "He continued walking through the desert.", "After about nine days he met people who helped him reach safety in Algeria."]}];
const main=document.getElementById('main');const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function add(content){const el=document.createElement('section');el.className='slide';el.innerHTML=content;main.appendChild(el);pages.push(el)}
add(`<div class="kicker">Independent homework · A2</div><h1>Three incredible<br>survival stories</h1><p class="lead">First revise the target vocabulary, practise it in context and translate sentences. Then <b>listen</b> to three true stories and answer the comprehension questions <b>in complete English sentences</b>.</p><div class="notice"><p><b>How to work</b></p><p>1. Study the vocabulary. 2. Practise it in context. 3. Translate. 4. Listen without reading. 5. Answer the questions. 6. Download your answers.</p></div><p class="small">British English audio uses an available UK voice on your device. If your browser has no UK voice, reading still works.</p><span class="pill">🌿 Amazon rainforest</span><span class="pill">🌊 Underwater</span><span class="pill">☀️ Sahara Desert</span>`);
const vocab=[['a challenge','сложная задача, испытание','Surviving alone was a real challenge.'],['achieve your goal','достичь своей цели','She worked hard to achieve her goal.'],['control your fear','контролировать свой страх','He tried to control his fear.'],['physical strength','физическая сила','Climbing needed physical strength.'],['mental strength','сила духа, психологическая стойкость','She needed mental strength to continue.'],['rely on','полагаться на','He could rely on his friend.'],['build a shelter','построить укрытие','They built a shelter from branches.'],['cope with','справляться с','She had to cope with the cold.'],['push yourself','заставлять себя продолжать, преодолевать себя','Sometimes you must push yourself to keep going.'],['survival skills','навыки выживания','His survival skills helped him.'],['the wilderness','дикая природа','They got lost in the wilderness.']];
add(`<div class="kicker">Part 1 · Target vocabulary</div><h2>Words that help you survive</h2><p class="small">Read the expressions, translations and examples. These are the expressions you will practise.</p><div class="vocabgrid">${vocab.slice(0,6).map(v=>`<div class="vocabcard"><b>${v[0]}</b><small>${v[1]}</small><p class="small">${v[2]}</p></div>`).join('')}</div>`);
add(`<div class="kicker">Part 1 · Target vocabulary</div><h2>Words that help you survive · 2</h2><div class="vocabgrid">${vocab.slice(6).map(v=>`<div class="vocabcard"><b>${v[0]}</b><small>${v[1]}</small><p class="small">${v[2]}</p></div>`).join('')}</div>`);

const contextItems=[
['After two days without food, finding something to eat became a real ____.','challenge'],
['Mia was frightened in the dark cave, but she tried to ____.','control her fear'],
['The hikers used branches and leaves to ____ before the rain started.','build a shelter'],
['When the path disappeared, the group had to ____ their guide.','rely on'],
['Walking for hours in deep snow required great ____.','physical strength'],
['Although Leo felt hopeless, his ____ helped him stay calm.','mental strength'],
['In the desert, they had to ____ the heat and the lack of water.','cope with'],
['The runner was exhausted, but she decided to ____ and continue.','push herself'],
['Knowing how to find clean water is one of the most useful ____.','survival skills'],
['They spent three days in the ____ without seeing another person.','wilderness'],
['After many difficult months, the climber finally managed to ____.','achieve his goal'],
['It was hard to stay positive, but the whole experience was a serious ____.','challenge']];

const contextsAnswers={};
function saveContext(i,v){contextsAnswers[i]=v}
function orderedOptions(i){const a=[...contextOptions];for(let j=a.length-1;j>0;j--){const k=(i*13+j*7+3)%(j+1);[a[j],a[k]]=[a[k],a[j]]}return a}
for(let k=0;k<3;k++)add(`<div class="kicker">Part 2 · Vocabulary in context</div><h2>Complete the survival situations · ${k+1}/3</h2><p class="small">Choose the expression that fits the meaning. Read the whole sentence first. Some expressions may be used more than once.</p>${contextItems.slice(k*4,k*4+4).map((item,j)=>{let i=k*4+j;return `<div class="translation"><label for="cx${i}">${i+1}. ${esc(item[0])}</label><select id="cx${i}" onchange="saveContext(${i},this.value)" style="font:19px system-ui;padding:13px;width:100%;border:1px solid #bdcfc4;border-radius:12px;background:white"><option value="">Choose an expression…</option>${orderedOptions(i).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select></div>`}).join('')}`);
const decisions=[
['You are walking in a forest when heavy rain starts. You have branches, large leaves and a few hours of daylight. What should you do first?','build a shelter','I would build a shelter before it gets dark.'],
['Your friend knows the mountain route, but you are lost. Who can you trust to find the way?','rely on','I can rely on my friend because she knows the route.'],
['You are tired and frightened, but you still have to walk to a safe place. What two things will help you continue?','mental strength','Mental strength will help me stay calm and continue.'],
['You want to finish a difficult hike safely. What is your main aim?','achieve your goal','My aim is to achieve my goal and reach the end safely.']];
add(`<div class="kicker">Part 2 · Apply the vocabulary</div><h2>What would you do?</h2><p class="small">Read each situation. Write one full sentence using the target expression shown below it.</p>${decisions.map((d,i)=>`<div class="question"><label>${i+1}. ${esc(d[0])}</label><p class="small">Use: <b>${esc(d[1])}</b></p><textarea id="decision${i}" oninput="saveDecision(${i},this.value)" placeholder="Write your own answer…"></textarea></div>`).join('')}`);
const decisionResponses={};function saveDecision(i,v){decisionResponses[i]=v}
const translations=[['Выжить в пустыне было настоящим испытанием.','Surviving in the desert was a real challenge.'],['Она хотела достичь своей цели.','She wanted to achieve her goal.'],['Он пытался контролировать свой страх.','He tried to control his fear.'],['Ему нужна была физическая сила, чтобы продолжать идти.','He needed physical strength to keep walking.'],['Она полагалась на свою силу духа.','She relied on her mental strength.'],['Они построили укрытие из веток.','They built a shelter from branches.'],['Ему пришлось справляться с холодом и голодом.','He had to cope with the cold and hunger.'],['Она заставляла себя продолжать идти.','She pushed herself to keep walking.'],['Его навыки выживания помогли ему в дикой природе.','His survival skills helped him in the wilderness.'],['На кого ты можешь положиться в трудной ситуации?','Who can you rely on in a difficult situation?']];
for(let k=0;k<2;k++)add(`<div class="kicker">Part 3 · Translate into English</div><h2>Russian → English · ${k+1}/2</h2><p class="small">Use the target vocabulary. Write full English sentences.</p>${translations.slice(k*5,k*5+5).map((t,j)=>`<div class="translation"><label for="tr${k*5+j}">${k*5+j+1}. ${t[0]}</label><input id="tr${k*5+j}" oninput="saveTranslation(${k*5+j},this.value)" placeholder="Type your English translation…"></div>`).join('')}`);
const imgs=['https://images.unsplash.com/photo-1448375240586-882707db888b?w=1400&q=85','https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1400&q=85','https://images.unsplash.com/photo-1509316785289-025f5b846b35?w=1400&q=85'];
stories.forEach((st,i)=>{add(`<div class="kicker">True story ${i+1} / Listening comprehension</div><h2>${esc(st.name)}</h2><span class="pill">${esc(st.loc)}</span><div class="hero" style="background-image:url('${imgs[i]}')"></div><div class="controls"><button class="primary" onclick="playStory(${i})">▶ Listen · British English</button><button onclick="stopAudio()">■ Stop</button><button onclick="playStory(${i},true)">▶ Slower</button></div><div class="voice" id="voice${i}"></div><button onclick="toggleTranscript(${i},this)">Show the transcript</button><div class="story transcript" id="transcript${i}">${st.paras.slice(2).map(p=>`<p>${esc(p)}</p>`).join('')}</div><p class="small">Real event · Adapted to A2. Landscape photograph is illustrative.</p>`);
add(`<div class="kicker">True story ${i+1} / Comprehension check</div><h2>${esc(st.name)}: what happened?</h2><p class="small">Write full sentences. You can listen again using the Previous button. Use Show the transcript only after your first listening. Your work is saved while this page remains open.</p>${st.qs.map((q,j)=>`<div class="question"><label for="a${i}_${j}">${j+1}. ${esc(q)}</label><textarea id="a${i}_${j}" placeholder="Write your answer here…" oninput="saveAnswer(${i},${j},this.value)"></textarea></div>`).join('')}`)});
add(`<div class="kicker">Finish & download</div><h2>Your homework is ready</h2><p>Download your completed answers as a text file. You can also download a separate model answer key <b>after you finish</b>.</p><div class="final"><p><b>Your name</b></p><input id="student" placeholder="Student name" style="width:100%;max-width:450px;font:20px system-ui;padding:14px;border:1px solid #b8c8bc;border-radius:12px"><div class="controls"><button class="primary" onclick="downloadStudent()">↓ Download my answers (.txt)</button><button onclick="downloadKey()">↓ Download model answers (.txt)</button></div><p class="small">Your own answers are not automatically checked or replaced. The model answers are examples, not the only possible correct wording.</p></div>`);
let current=0;function show(n){stopAudio();current=Math.max(0,Math.min(n,pages.length-1));pages.forEach((p,i)=>p.classList.toggle('active',i===current));document.getElementById('counter').textContent=`${current+1} / ${pages.length}`;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===pages.length-1;window.scrollTo(0,0)}document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(['TEXTAREA','INPUT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});show(0);
const translationResponses={};function saveTranslation(i,v){translationResponses[i]=v}function toggleTranscript(i,btn){const el=document.getElementById("transcript"+i);const visible=el.classList.toggle("open");btn.textContent=visible?"Hide the transcript":"Show the transcript"}const responses={};function saveAnswer(i,j,v){responses[`${i}_${j}`]=v}function stopAudio(){if('speechSynthesis'in window)window.speechSynthesis.cancel()}
function playStory(i,slow=false){if(!('speechSynthesis'in window)){document.getElementById('voice'+i).textContent='Speech playback is not supported in this browser.';return}stopAudio();const voices=speechSynthesis.getVoices();const uk=voices.filter(v=>/^en[-_]GB/i.test(v.lang));const preferred=uk.find(v=>/natural|premium|online|sonia|libby|ryan|serena|george/i.test(v.name))||uk[0];const msg=document.getElementById('voice'+i);if(!preferred){msg.textContent='A British English voice is not installed in this browser. Please install or select an en-GB voice for authentic British pronunciation.';return}msg.textContent='Voice: '+preferred.name+' · English (UK)';let text=stories[i].paras.slice(2).join(' ');const chunks=text.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[text];let k=0;function next(){if(k>=chunks.length)return;const u=new SpeechSynthesisUtterance(chunks[k++]);u.voice=preferred;u.lang='en-GB';u.rate=slow?.82:.94;u.pitch=1;u.onend=next;u.onerror=()=>{msg.textContent='Audio playback stopped. Try the Listen button again.'};speechSynthesis.speak(u)}next()}
function downloadFile(name,text){const blob=new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function downloadStudent(){const name=document.getElementById('student').value.trim()||'Student';let out='SURVIVAL STORIES — A2 HOMEWORK\nName: '+name+'\n\n';out+='VOCABULARY IN CONTEXT\n';contextItems.forEach((t,i)=>out+=`${i+1}. ${t[0]}\nAnswer: ${contextsAnswers[i]||'(not answered)'}\n\n`);out+='SURVIVAL DECISIONS\n';decisions.forEach((d,i)=>out+=`${i+1}. ${d[0]}\nAnswer: ${decisionResponses[i]||'(not answered)'}\n\n`);out+='TRANSLATION EXERCISES\n';translations.forEach((t,i)=>out+=`${i+1}. ${t[0]}\nAnswer: ${translationResponses[i]||'(not answered)'}\n\n`);out+='LISTENING COMPREHENSION\n\n';stories.forEach((s,i)=>{out+=s.name.toUpperCase()+'\n';s.qs.forEach((q,j)=>out+=`${j+1}. ${q}\nAnswer: ${responses[`${i}_${j}`]||'(not answered)'}\n\n`)});downloadFile('survival_homework_answers.txt',out)}
function downloadKey(){let out='SURVIVAL STORIES — MODEL ANSWERS\nExample answers; other correct formulations are possible.\n\n';out+='VOCABULARY IN CONTEXT — ANSWERS\n';contextItems.forEach((t,i)=>out+=`${i+1}. ${t[1]}\n`);out+='\nSURVIVAL DECISIONS — SAMPLE ANSWERS\n';decisions.forEach((d,i)=>out+=`${i+1}. ${d[2]}\n`);out+='\nTRANSLATION MODEL ANSWERS\n';translations.forEach((t,i)=>out+=`${i+1}. ${t[1]}\n`);out+='\nLISTENING MODEL ANSWERS\n\n';stories.forEach(s=>{out+=s.name.toUpperCase()+'\n';s.qs.forEach((q,j)=>out+=`${j+1}. ${q}\n${s.answers[j]}\n\n`)});downloadFile('survival_model_answers.txt',out)}
